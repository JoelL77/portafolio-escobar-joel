<div class="card mt-3">
  <div class="image">
    @if (project().featured) {
      <div class="featured">
        <i class="pi pi-star-fill"></i>

        Destacado
      </div>
    }

    <img [src]="project().image" [alt]="project().title" />
  </div>

  <div class="content">
    <h3>
      {{ project().title }}
    </h3>

    <p>
      {{ project().description }}
    </p>

    <div class="techs">
      @for (tech of project().technologies; track tech.name) {
        <i [class]="tech.icon" [pTooltip]="tech.name" tooltipPosition="top"> </i>
      }
    </div>

    <div class="footer">
      <span class="type">
        {{ project().type }}
      </span>

      <button (click)="viewProject()">Ver Proyecto</button>
    </div>
  </div>
</div>
